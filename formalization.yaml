status:
  scope: >-
    Formalized: the finite check 64 | T(m) for m <= 512 and 256 | Phi(n) for n <= 512 (kernel
    computation, with a proof that the fast count equals the count over the box); Phi(n) =
    4(T(n) + sum_{k>=1} 2 T(n - k^2)); Sturm's theorem iterated eight times; 64 | T(m) for all m;
    r3(n) = 3 r_{1,2,2}(n) for n = 1 (mod 4), r3(2n) = 3 r_{1,1,2}(n) and r_{1,1,2}(n) =
    2 r_{1,2,4}(n) for odd n; uniqueness of p = a^2 + b^2 with b even; gCount p = 4A (mod 8);
    2 r_{1,2,4}(p) - r_{1,2,2}(p) = 32A (mod 64); r3(2p) - r3(p) = 96A (mod 192); the class
    number congruence; Conjecture 5.3 of Paper V; the octant sum modulo 4 and the parity of the
    number of nonresidues in (0, p/8); the combination with Desnoux's congruence. Not
    formalized: that Phi is a modular form of weight 2 on Gamma0(1024) cap ker chi8 (Serre-Stark),
    Sturm's theorem, Gauss's r3(m) = 12 h(-4m) and its link to Mathlib's class number, Paper V
    Theorem 5.2(iv), Berndt's (7.3), and Desnoux's Theorem B.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

